title: Armário de Contos
email: armariodecontos@gmail.com
description: "Abra a porta para uma nova história."
url: https://armariodecontos.github.io
baseurl: ""
lang: pt-BR
timezone: America/Recife
author: "Arquiteto de Narrativas"
github_username: armariodecontos

social:
  youtube: https://youtube.com/@armariodecontos

theme: minima
plugins:
  - jekyll-feed

collections:
  contos:
    output: true
    permalink: /contos/:name/
  series:
    output: true
    permalink: /series/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  - scope:
      path: ""
      type: contos
    values:
      layout: conto

  - scope:
      path: ""
      type: series
    values:
      layout: serie