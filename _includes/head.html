<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title and page.layout != 'home' %}
      {{ page.title | escape }} ·
    {% endif %}
    {{ site.title | escape }}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta name="theme-color" content="{{ site.data.theme.theme_color }}">
  <link rel="icon" type="image/png" href="{{ site.data.theme.favicon | relative_url }}">
  <link rel="stylesheet" href="{{ site.data.theme.stylesheet | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/ajustes-colecoes.css' | relative_url }}">
  

  {% if site.plugins contains 'jekyll-feed' %}
    {% feed_meta %}
  {% endif %}

  <meta property="og:type" content="{{ page.og_type | default: 'website' }}">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.cover | default: site.data.theme.og_image | absolute_url }}">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | escape }}">
  <meta name="twitter:image" content="{{ page.cover | default: site.data.theme.og_image | absolute_url }}">
</head>
